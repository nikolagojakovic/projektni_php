version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DATABASE_URL: postgresql://chatuser:chatpass@db:5432/chatapp
      APP_URL: http://localhost:8080
      APP_ENV: development
      SESSION_SECRET: dev_secret_32chars_change_in_prod
      SMTP_HOST: sandbox.smtp.mailtrap.io
      SMTP_PORT: 2525
      SMTP_USER: your_mailtrap_user
      SMTP_PASS: your_mailtrap_pass
      SMTP_FROM: noreply@chatapp.local
      SMTP_FROM_NAME: ChatApp
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: chatapp
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
